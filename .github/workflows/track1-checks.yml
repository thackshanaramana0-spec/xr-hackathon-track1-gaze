# Re-runs the independent Track 1 checks (extras/tools/check_bundle.py) on the committed submission files at every push:
# metadata schema, clockwise sequence, 1024x1024 PNGs, 35/40 cm calibration, convergence, pupil centres
# detected in the images vs metadata, constant lighting, and the five-direction test.
name: Track 1 checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r extras/requirements.txt
      # exit 0 = all pass; exit 2 = nothing failed but some checks could not run (eye close-up renders are not in the repo);
      # exit 1 = a check failed. Only exit 1 fails this job; NOT VERIFIED stays visible in the report.
      - run: python extras/tools/check_bundle.py . out/gate0 || [ $? -eq 2 ]
      - run: cat out/gate0/report.md >> "$GITHUB_STEP_SUMMARY"
